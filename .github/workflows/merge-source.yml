name: Merge android-lptools source

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  merge-source:
    if: github.event.head_commit.message != 'Merge android-lptools android-14 source'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge android-lptools history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add source https://github.com/qyzui/android-lptools.git
          git fetch --no-tags source android-14

          git merge --allow-unrelated-histories --no-commit source/android-14 || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            if [ "$conflicts" != "README.md" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours README.md
            git add README.md
          fi

          mkdir -p docs
          git show source/android-14:README.md > docs/ANDROID-LPTOOLS.md
          git add docs/ANDROID-LPTOOLS.md

          git rm -f .github/workflows/merge-source.yml
          git commit -m "Merge android-lptools android-14 source"
          git push origin HEAD:main
