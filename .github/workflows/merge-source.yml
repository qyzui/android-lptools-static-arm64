name: Merge android-lptools source\n\non:\n  push:\n    branches: [ main ]\n\npermissions:\n  contents: write\n\njobs:\n  merge-source:\n    if: github.event.head_commit.message != 'Merge android-lptools android-14 source'\n    runs-on: ubuntu-24.04\n    steps:\n      - name: Checkout target repository\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n          persist-credentials: true\n\n      - name: Merge android-lptools history\n        shell: bash\n        run: |\n          set -euo pipefail\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n\n          git remote add source https://github.com/qyzui/android-lptools.git\n          git fetch --no-tags source android-14\n\n          git merge --allow-unrelated-histories --no-commit source/android-14\n\n          if git ls-files -u | grep -q '^'; then\n            echo "Resolving README.md in favor of the target repository."\n            git checkout --ours README.md\n            git add README.md\n          fi\n\n          mkdir -p docs\n          git show source/android-14:README.md > docs/ANDROID-LPTOOLS.md\n          git add docs/ANDROID-LPTOOLS.md\n\n          git rm -f .github/workflows/merge-source.yml\n          git commit -m "Merge android-lptools android-14 source"\n          git push origin HEAD:main\n